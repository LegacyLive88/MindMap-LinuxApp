# Optional. Use this only if you can add a vhost include in WHM and you want
# nginx to reach Next.js without the PHP proxy. The usual cPanel nginx layer
# already forwards to Apache, and Apache uses public/.htaccess instead.

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 60s;
}
