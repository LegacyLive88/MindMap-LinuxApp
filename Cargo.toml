[package]
name = "mindmap"
version = "1.0.0"
edition = "2021"
description = "A portable mind-mapping canvas"
readme = "README.md"

[dependencies]
aes-gcm = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
egui = "0.29"
hkdf = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Linux keeps the same window backends as before. Windows uses the same
# OpenGL canvas (glow) without the X11 and Wayland backends.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
